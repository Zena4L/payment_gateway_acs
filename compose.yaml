include:
  - compose.postgres.yaml

services:
  app:
    build: .
    image: acs-payment:local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${APP_PORT:-8080}:8080'
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-stage}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      ACS_PAYSTACK_SECRET_KEY: ${ACS_PAYSTACK_SECRET_KEY}
      ACS_SECURITY_BOOTSTRAP_ADMIN_KEY: ${ACS_SECURITY_BOOTSTRAP_ADMIN_KEY:-}
