spring:
  application:
    name: acs_payment
  profiles:
    default: dev
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  threads:
    virtual:
      enabled: true

  mvc:
    problemdetails:
      enabled: true

  datasource:
    hikari:
      auto-commit: false
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      max-lifetime: 600000
      connection-timeout: 5000

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 15
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: true
        query:
          in_clause_parameter_padding: true
          fail_on_pagination_over_collection_fetch: true
          plan_cache_max_size: 4096

  flyway:
    enabled: true

  modulith:
    events:
      republish-outstanding-events-on-restart: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
  compression:
    enabled: true
    mime-types: application/json,application/problem+json

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    root: INFO

acs:
  paystack:
    base-url: https://api.paystack.co
    connect-timeout: 2s
    response-timeout: 10s
    retry:
      max-attempts: 3
      initial-backoff: 500ms
      max-retry-after: 5s
  payment:
    supported-currencies: GHS
    duplicate-window: 60s
  reconciliation:
    enabled: true
    interval: 15m
    stale-threshold: 15m
    expiry-cutoff: 24h
    batch-size: 100
